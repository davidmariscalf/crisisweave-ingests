name: ci
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile crisisweave_ingests.py
      - run: |
          python - <<'PY'
          from crisisweave_ingests import parse_json
          out = parse_json('[{"title":"Flood reported","source":"test","severity":0.8}]')
          assert len(out) == 1
          assert out[0]['kind'] == 'flood'
          assert out[0]['source']['name'] == 'test'
          PY
