name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m py_compile crisisweave_ingests.py tests/test_ingests.py
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: |
          python - <<'PY'
          from crisisweave_ingests import parse_json
          out = parse_json('[{"title":"Flood reported","source":"test","severity":0.8}]')
          assert len(out) == 1
          assert out[0]['kind'] == 'flood'
          assert out[0]['source']['name'] == 'test'
          assert out[0]['source']['source_id']
          PY
